<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JN CRM | Pide tu demo de 3 días GRATIS</title>

  <!-- PWA & Mobile Icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#25D366">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JN CRM">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Tipografía & Iconos -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #25D366;
      --primary-hover: #20bd5a;
      --gold: #D4AF37;
      --bg: #070a12;
      --card-bg: rgba(14, 20, 36, 0.92);
      --input-bg: #12192c;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(37, 211, 102, 0.5);
      --text: #ffffff;
      --text-muted: #94a3b8;
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.4);
      --error-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(37, 211, 102, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #060911 0%, #0c1220 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo {
      width: 78px;
      height: 78px;
      object-fit: contain;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 16px rgba(212, 175, 55, 0.25));
    }

    .brand-header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .brand-header h1 span {
      color: var(--primary);
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 14px;
      max-width: 360px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Banner Informativo Contacto vs Usuario */
    .contact-banner {
      background: rgba(37, 211, 102, 0.08);
      border: 1px solid rgba(37, 211, 102, 0.25);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 12.5px;
      line-height: 1.45;
      color: #e2e8f0;
    }

    .contact-banner i {
      color: var(--primary);
      font-size: 18px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .contact-banner strong {
      color: #ffffff;
    }

    .contact-banner .highlight {
      color: var(--primary);
      font-weight: 700;
    }

    /* Alerta de error */
    .alert-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .form-group {
      margin-bottom: 18px;
    }

    .label-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }

    /* Badges de soporte y aclaración */
    .field-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .badge-contact {
      background: rgba(37, 211, 102, 0.15);
      color: var(--primary);
      border: 1px solid rgba(37, 211, 102, 0.35);
    }

    .badge-account {
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold);
      border: 1px solid rgba(212, 175, 55, 0.35);
    }

    .field-hint {
      display: block;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .field-hint i {
      color: var(--primary);
      margin-right: 4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.lead-icon {
      position: absolute;
      left: 16px;
      color: var(--primary);
      font-size: 15px;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 44px 14px 46px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

      border-color: var(--primary
